<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Flow Planner — Ultra Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 0% 0%, #16192b 0%, #090a10 100%);
            color: #f8fafc;
        }

        /* Glassmorphic Surfaces */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .glass-panel-interactive {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel-interactive:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 20px 40px rgba(6, 182, 212, 0.1);
            transform: translateY(-2px);
        }

        /* Overpowered Checkbox Matrix */
        .custom-cb {
            appearance: none;
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }
        .custom-cb:checked {
            border-color: transparent;
            background: linear-gradient(135deg, #a855f7, #06b6d4);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
        .custom-cb:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 0.9rem;
            font-weight: 800;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .no-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 10px;
        }
        .no-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s;
        }
        .no-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-between overflow-x-hidden relative">

    <!-- Subtle Ambient Background Light Orbs -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-500/10 rounded-full blur-[150px] pointer-events-none"></div>
    <div class="absolute bottom-[10%] right-[-10%] w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[180px] pointer-events-none"></div>

    <div class="max-w-[1500px] w-full mx-auto space-y-6 relative z-10">
        
        <!-- HEADER -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel px-8 py-5 rounded-2xl gap-4">
            <div class="flex items-center space-x-4">
                <div class="relative flex items-center justify-center">
                    <div class="absolute w-4 h-9 bg-purple-500 rounded-full blur-sm opacity-60"></div>
                    <div class="w-3 h-8 bg-gradient-to-b from-purple-500 to-cyan-400 rounded-full relative z-10"></div>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Daily Flow Planner</h1>
                    <p id="current-month-year-label" class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest mt-1">July 2026</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <select id="category-filter" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs font-semibold text-slate-300 outline-none focus:border-cyan-500/50 cursor-pointer">
                    <option value="all" class="bg-[#16192b]">All Systems</option>
                    <option value="General" class="bg-[#16192b]">General Tasks</option>
                    <option value="Personal" class="bg-[#16192b]">Personal Goals</option>
                </select>
                <div class="flex items-center space-x-2.5 bg-white/5 border border-white/5 px-4 py-2 rounded-xl">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
                    <span id="live-clock" class="text-xs font-bold text-slate-300 tracking-widest">00:00:00 AM</span>
                </div>
            </div>
        </header>

        <!-- GRID INTERFACE -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- COLUMN 1: MONTHLY TIMELINE OVERVIEW (Left) -->
            <aside class="lg:col-span-3 space-y-4">
                <div class="px-2 flex justify-between items-center">
                    <h2 class="text-xs font-bold text-slate-400 tracking-widest uppercase">System Calendar</h2>
                    <span id="task-count-badge" class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold tracking-wide">0 Days Active</span>
                </div>
                
                <div id="monthly-day-list" class="space-y-2 max-h-[640px] overflow-y-auto pr-1 no-scrollbar">
                    <!-- Dynamic Date Blocks generated by JS engine -->
                </div>
            </aside>

            <!-- COLUMN 2: DAILY CORE TERMINAL (Center) -->
            <main class="lg:col-span-5 glass-panel rounded-2xl p-6 space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-white/5 pb-5 gap-4">
                    <div>
                        <h2 class="text-xs font-bold text-purple-400 tracking-widest uppercase">Workspace Timeline</h2>
                        <h3 id="active-day-title" class="text-xl font-extrabold text-white tracking-tight mt-1">JULY 21, TUESDAY</h3>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <!-- Sleep Log Controller -->
                        <div class="flex items-center gap-2 bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl">
                            <span class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest">Sleep:</span>
                            <input type="text" id="sleep-input" placeholder="--h" class="text-xs font-extrabold text-white bg-transparent outline-none w-12 text-center border-b border-transparent focus:border-cyan-400" title="Enter sleep duration">
                        </div>
                        
                        <button id="add-task-btn" class="bg-gradient-to-r from-purple-500 to-cyan-500 hover:opacity-90 text-white font-bold text-xs px-3 py-2 rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all flex items-center gap-1.5 cursor-pointer border border-white/10">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                            NEW
                        </button>
                    </div>
                </div>

                <!-- DYNAMIC TASK ROW WRAPPERS (With Scrollable Height Container that grows and scrolls) -->
                <div id="task-container" class="space-y-3 min-h-[150px] max-h-[465px] overflow-y-auto pr-1 no-scrollbar">
                    <!-- Injected rows -->
                </div>
            </main>

            <!-- COLUMN 3: REAL-TIME ANALYTICS RADAR (Right) -->
            <section class="lg:col-span-4 space-y-6">
                
                <!-- Donut Progress Panel -->
                <div class="glass-panel rounded-2xl p-6 flex flex-col items-center relative overflow-hidden">
                    <div class="w-full text-left mb-4">
                        <h2 class="text-xs font-bold text-cyan-400 tracking-widest uppercase">Day Analytics Spectrum</h2>
                    </div>
                    <div class="relative w-40 h-40 flex items-center justify-center">
                        <canvas id="donutChart" width="160" height="160"></canvas>
                        <div class="absolute text-center flex flex-col">
                            <span id="donutPercentText" class="text-4xl font-black tracking-tighter text-white">0%</span>
                            <span class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Yield</span>
                        </div>
                    </div>
                    <div class="mt-4 text-center">
                        <p id="completionStatusSubtext" class="text-xs font-bold text-slate-400 uppercase tracking-wider">0 of 0 metrics completed</p>
                    </div>
                </div>

                <!-- Sleep Metrics Bar Chart Panel -->
                <div class="glass-panel rounded-2xl p-6">
                    <div class="mb-4 flex justify-between items-center">
                        <div>
                            <h2 class="text-xs font-bold text-cyan-400 tracking-widest uppercase">Rest & Recovery Log</h2>
                            <h3 class="text-sm font-bold text-white mt-0.5">WEEKLY SLEEP DURATION</h3>
                        </div>
                        <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md font-mono">HOURS</span>
                    </div>
                    
                    <!-- Dynamic Sleep Bar Visualizer Container -->
                    <div id="sleep-chart-container" class="space-y-2.5 pt-1">
                        <!-- Bars injected dynamically via script -->
                    </div>
                </div>

            </section>
        </div>
    </div>

    <!-- PORTABILITY SYSTEM HUB (Bottom Right) -->
    <footer class="mt-8 flex justify-end">
        <div class="glass-panel px-5 py-3 rounded-xl flex items-center gap-4">
            <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase border-r border-white/10 pr-4">Data Portability</span>
            <button id="export-btn" class="group flex items-center gap-2 text-xs font-bold text-slate-300 hover:text-cyan-400 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 group-hover:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                EXPORT ENGINE
            </button>
            <button id="import-btn" class="group flex items-center gap-2 text-xs font-bold text-slate-300 hover:text-purple-400 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 group-hover:text-purple-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                IMPORT SOURCE
            </button>
            <input type="file" id="import-file-input" class="hidden" accept=".json">
        </div>
    </footer>

    <!-- LOGIC ORCHESTRATION ENGINE -->
    <script>
        let state = {
            selectedDateStr: "", 
            tasksByDay: {},
            sleepByDay: {},
            activeFilter: "all"
        };

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const explicitWeekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        function initApp() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDay = now.getDate();

            document.getElementById('current-month-year-label').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            state.selectedDateStr = formatDateKey(currentYear, currentMonth, currentDay);

            // Load data matrix configuration
            const savedData = localStorage.getItem('flow_planner_ultra_matrix');
            const savedSleep = localStorage.getItem('flow_planner_sleep_matrix');
            
            if (savedData) {
                try { state.tasksByDay = JSON.parse(savedData); } catch(e) { state.tasksByDay = {}; }
            } else {
                state.tasksByDay = {};
            }

            if (savedSleep) {
                try { state.sleepByDay = JSON.parse(savedSleep); } catch(e) { state.sleepByDay = {}; }
            } else {
                state.sleepByDay = {};
            }

            setupClock();
            buildMonthlyCalendarList(currentYear, currentMonth, currentDay);
            selectDay(state.selectedDateStr);
            setupEventListeners();
        }

        function formatDateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function saveToLocalStorage() {
            localStorage.setItem('flow_planner_ultra_matrix', JSON.stringify(state.tasksByDay));
        }

        function saveSleepToLocalStorage() {
            localStorage.setItem('flow_planner_sleep_matrix', JSON.stringify(state.sleepByDay));
        }

        function setupClock() {
            const updateClock = () => {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
            };
            updateClock();
            setInterval(updateClock, 1000);
        }

        function buildMonthlyCalendarList(year, month, currentDay) {
            const listContainer = document.getElementById('monthly-day-list');
            listContainer.innerHTML = '';

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let loadedDayCount = 0;

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dayNameShort = dateObj.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                const dateKey = formatDateKey(year, month, d);
                
                const dayTasks = state.tasksByDay[dateKey] || [];
                const taskCount = dayTasks.length;
                const completedCount = dayTasks.filter(t => t.completed).length;

                const dayCard = document.createElement('div');
                dayCard.id = `day-card-${dateKey}`;
                dayCard.className = `day-selector-item glass-panel glass-panel-interactive p-3.5 rounded-xl flex justify-between items-center cursor-pointer`;
                
                let badgeMarkup = '<span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>';
                let glowColor = 'bg-transparent';

                if(taskCount > 0) {
                    const ratio = completedCount / taskCount;
                    if (ratio === 1) glowColor = 'bg-emerald-400 shadow-[0_0_10px_#10b981]';
                    else if (ratio > 0) glowColor = 'bg-cyan-400 shadow-[0_0_10px_#06b6d4]';
                    else glowColor = 'bg-slate-500';
                    
                    badgeMarkup = `<span class="text-[9px] font-extrabold px-2 py-0.5 rounded-md bg-white/5 text-slate-300 border border-white/10 ${glowColor.split(' ')[0]}">${completedCount}/${taskCount}</span>`;
                    loadedDayCount++;
                }

                dayCard.innerHTML = `
                    <div class="flex flex-col text-left">
                        <span class="text-[9px] font-bold text-slate-500 tracking-wider">${dayNameShort}</span>
                        <span class="text-sm font-extrabold text-slate-300 mt-0.5">${String(d).padStart(2, '0')}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        ${badgeMarkup}
                        <div class="w-1 h-4 rounded-full ${glowColor.split(' ')[0]}"></div>
                    </div>
                `;

                dayCard.addEventListener('click', () => selectDay(dateKey));
                listContainer.appendChild(dayCard);
            }

            document.getElementById('task-count-badge').innerText = `${loadedDayCount} Days Tracked`;
        }

        function selectDay(dateKey) {
            state.selectedDateStr = dateKey;

            document.querySelectorAll('.day-selector-item').forEach(el => {
                el.classList.remove('border-purple-500/60', 'bg-white/10', 'shadow-[0_0_20px_rgba(168,85,247,0.15)]');
            });

            const targetEl = document.getElementById(`day-card-${dateKey}`);
            if (targetEl) {
                targetEl.classList.add('border-purple-500/60', 'bg-white/10', 'shadow-[0_0_20px_rgba(168,85,247,0.15)]');
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            const parts = dateKey.split('-');
            const dateObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            document.getElementById('active-day-title').innerText = `${monthNames[dateObj.getMonth()].toUpperCase()} ${parts[2]}, ${explicitWeekdays[dateObj.getDay()].toUpperCase()}`;

            // Populate sleep input for selected day cleanly without defaults
            const sleepInput = document.getElementById('sleep-input');
            sleepInput.value = state.sleepByDay[dateKey] || "";

            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('task-container');
            container.innerHTML = '';

            const allTasks = state.tasksByDay[state.selectedDateStr] || [];
            const activeTasks = allTasks.filter(t => state.activeFilter === "all" || t.type === state.activeFilter);

            if(activeTasks.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-slate-500 space-y-3">
                        <div class="p-4 bg-white/5 rounded-full border border-white/5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                        </div>
                        <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Timeline Sector Inactive</span>
                    </div>`;
                updateAnalytics();
                return;
            }

            activeTasks.forEach(task => {
                const row = document.createElement('div');
                const borderGlow = task.completed 
                    ? 'border-l-4 border-l-emerald-400 bg-emerald-500/5 shadow-[rgba(16,185,129,0.05)_0_10px_20px]' 
                    : 'border-l-4 border-l-purple-500 bg-white/[0.02]';

                row.className = `flex items-center justify-between p-4 rounded-xl border border-white/5 transition-all ${borderGlow}`;
                row.innerHTML = `
                    <div class="flex items-center space-x-4 flex-1 mr-4">
                        <input type="checkbox" class="custom-cb animate-all" ${task.completed ? 'checked' : ''} data-id="${task.id}">
                        <div class="flex items-center gap-4 flex-1">
                            <input type="text" value="${task.text}" class="text-sm font-medium ${task.completed ? 'text-slate-500 line-through' : 'text-slate-200'} bg-transparent outline-none flex-1 border-b border-transparent focus:border-purple-500" data-field="text" data-id="${task.id}">
                            <span class="text-[9px] font-extrabold px-2 py-0.5 rounded border ${task.type === 'Personal' ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20'}">${task.type}</span>
                        </div>
                    </div>
                    <button class="delete-task-btn text-slate-600 hover:text-rose-400 p-1 rounded-lg transition-colors cursor-pointer" data-id="${task.id}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                `;
                container.appendChild(row);
            });

            updateAnalytics();
        }

        function setupEventListeners() {
            document.getElementById('add-task-btn').addEventListener('click', () => {
                if (!state.tasksByDay[state.selectedDateStr]) {
                    state.tasksByDay[state.selectedDateStr] = [];
                }
                
                const activeTasks = state.tasksByDay[state.selectedDateStr];
                const newId = activeTasks.length > 0 ? Math.max(...activeTasks.map(t => t.id)) + 1 : 1;
                const assignedType = activeTasks.length % 2 === 0 ? "General" : "Personal";

                activeTasks.push({
                    id: newId,
                    text: "Enter core production objective node parameters...",
                    completed: false,
                    type: assignedType
                });

                saveToLocalStorage();
                renderTasks();
                refreshCalendarUI();
            });

            // Sleep input change listener
            document.getElementById('sleep-input').addEventListener('blur', (e) => {
                const val = e.target.value.trim();
                if (val === "") {
                    delete state.sleepByDay[state.selectedDateStr];
                } else {
                    state.sleepByDay[state.selectedDateStr] = val;
                }
                saveSleepToLocalStorage();
                drawSleepBarChart();
            });

            document.getElementById('category-filter').addEventListener('change', (e) => {
                state.activeFilter = e.target.value;
                renderTasks();
            });

            const container = document.getElementById('task-container');
            
            container.addEventListener('change', (e) => {
                if (e.target.classList.contains('custom-cb')) {
                    const id = parseInt(e.target.dataset.id);
                    const activeTasks = state.tasksByDay[state.selectedDateStr] || [];
                    const task = activeTasks.find(t => t.id === id);
                    if(task) {
                        task.completed = e.target.checked;
                        saveToLocalStorage();
                        renderTasks();
                        refreshCalendarUI();
                    }
                }
            });

            container.addEventListener('blur', (e) => {
                if (e.target.dataset.field === 'text') {
                    const id = parseInt(e.target.dataset.id);
                    const activeTasks = state.tasksByDay[state.selectedDateStr] || [];
                    const task = activeTasks.find(t => t.id === id);
                    if(task) {
                        task.text = e.target.value;
                        saveToLocalStorage();
                    }
                }
            }, true);

            container.addEventListener('click', (e) => {
                const btn = e.target.closest('.delete-task-btn');
                if (btn) {
                    const id = parseInt(btn.dataset.id);
                    state.tasksByDay[state.selectedDateStr] = (state.tasksByDay[state.selectedDateStr] || []).filter(t => t.id !== id);
                    if(state.tasksByDay[state.selectedDateStr].length === 0) {
                        delete state.tasksByDay[state.selectedDateStr];
                    }
                    saveToLocalStorage();
                    renderTasks();
                    refreshCalendarUI();
                }
            });

            document.getElementById('export-btn').addEventListener('click', exportData);
            document.getElementById('import-btn').addEventListener('click', () => {
                document.getElementById('import-file-input').click();
            });
            document.getElementById('import-file-input').addEventListener('change', importData);
        }

        function refreshCalendarUI() {
            const now = new Date();
            buildMonthlyCalendarList(now.getFullYear(), now.getMonth(), now.getDate());
            const targetEl = document.getElementById(`day-card-${state.selectedDateStr}`);
            if (targetEl) targetEl.classList.add('border-purple-500/60', 'bg-white/10');
        }

        function updateAnalytics() {
            const allTasks = state.tasksByDay[state.selectedDateStr] || [];
            const total = allTasks.length;
            const completed = allTasks.filter(t => t.completed).length;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('donutPercentText').innerText = `${percentage}%`;
            document.getElementById('completionStatusSubtext').innerText = `${completed} of ${total} metrics absolute`;

            drawDonutChart(percentage);
            drawSleepBarChart();
        }

        // CANVAS PLOTTING SUBSYSTEMS
        function drawDonutChart(percentage) {
            const canvas = document.getElementById('donutChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const x = canvas.width / 2;
            const y = canvas.height / 2;
            const radius = 65;
            const lineWidth = 12;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.stroke();

            if (percentage > 0) {
                ctx.beginPath();
                const startAngle = -0.5 * Math.PI;
                const endAngle = startAngle + (percentage / 100) * (2 * Math.PI);
                ctx.arc(x, y, radius, startAngle, endAngle);
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';

                const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, '#a855f7'); 
                gradient.addColorStop(1, '#06b6d4'); 
                
                ctx.strokeStyle = gradient;
                ctx.stroke();
            }
        }

        // SLEEP BAR CHART VISUALIZER RENDERER
        function drawSleepBarChart() {
            const container = document.getElementById('sleep-chart-container');
            if (!container) return;
            container.innerHTML = '';

            const sortedKeys = Object.keys(state.sleepByDay).sort().slice(-5);
            
            if (sortedKeys.length === 0) {
                container.innerHTML = `<span class="text-[10px] text-slate-500 uppercase tracking-widest">No sleep metrics logged</span>`;
                return;
            }

            sortedKeys.forEach(dateKey => {
                const valStr = state.sleepByDay[dateKey] || "0h";
                const numericHours = parseFloat(valStr) || 0.0;
                const percent = Math.min(Math.max((numericHours / 10) * 100, 10), 100);
                
                const parts = dateKey.split('-');
                const labelDate = `${parts[1]}/${parts[2]}`;

                const barRow = document.createElement('div');
                barRow.className = "flex items-center gap-3";
                barRow.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-400 w-10 font-mono">${labelDate}</span>
                    <div class="flex-1 bg-white/5 h-2.5 rounded-full overflow-hidden p-0.5 border border-white/5">
                        <div class="bg-gradient-to-r from-cyan-400 to-purple-500 h-full rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(6,182,212,0.4)]" style="width: ${percent}%"></div>
                    </div>
                    <span class="text-[10px] font-extrabold text-cyan-300 w-12 text-right font-mono">${numericHours}h</span>
                `;
                container.appendChild(barRow);
            });
        }

        // DATA MATRIX HUB SYSTEM METHODS
        function exportData() {
            const exportBundle = {
                tasksByDay: state.tasksByDay,
                sleepByDay: state.sleepByDay
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportBundle, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "daily_flow_planner_ultra_matrix.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            const file = event.target.files[0];
            if (!file) return;

            fileReader.onload = function(e) {
                try {
                    const importedMatrix = JSON.parse(e.target.result);
                    if (importedMatrix && typeof importedMatrix === 'object') {
                        if (importedMatrix.tasksByDay) {
                            state.tasksByDay = importedMatrix.tasksByDay;
                            saveToLocalStorage();
                        }
                        if (importedMatrix.sleepByDay) {
                            state.sleepByDay = importedMatrix.sleepByDay;
                            saveSleepToLocalStorage();
                        }
                        
                        const now = new Date();
                        buildMonthlyCalendarList(now.getFullYear(), now.getMonth(), now.getDate());
                        
                        const keys = Object.keys(state.tasksByDay);
                        selectDay(keys.length > 0 ? keys[0] : formatDateKey(now.getFullYear(), now.getMonth(), now.getDate()));
                        
                        alert("Quantum Database Matrix Loaded Successfully!");
                    } else {
                        alert("Invalid JSON Matrix Layout Schema Template Syntax.");
                    }
                } catch (err) {
                    alert("Fatal error loading structural files framework stream.");
                }
            };
            fileReader.readAsText(file);
        }

        window.onload = initApp;
    </script>
